server:
  port: 8085

spring:
  application:
    name: contract-tenant-service
  datasource:
    url: ${CONTRACT_DB_URL:jdbc:postgresql://localhost:5432/contract_db}
    username: ${CONTRACT_DB_USER:contract_svc}
    password: ${CONTRACT_DB_PASSWORD:change_me_in_dot_env}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  # Producer for the outbox relay (docs muc 5.3); same settings as auth-service.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: contract-tenant-service
      auto-offset-reset: earliest
      # Spec 5.3: ack-mode RECORD is configured on the listener factory (KafkaConfig).
      properties:
        enable.auto.commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    # Dev local: heartbeat nhanh de Gateway thay instance vua restart trong ~5-10s.
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

contract:
  # Khách phải ký trong vòng 2 ngày (48 giờ) kể từ khi hợp đồng được tạo.
  signature-deadline-days: ${CONTRACT_SIGNATURE_DEADLINE_DAYS:2}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:minioadmin}
    secret-key: ${MINIO_ROOT_PASSWORD:change_me_in_dot_env}
    bucket: ${MINIO_CONTRACT_BUCKET:contract-documents}
  pdf:
    font-regular: fonts/NotoSans-Regular.ttf
    font-bold: fonts/NotoSans-Bold.ttf

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p [correlationId:%X{correlationId}] [userId:%X{userId}]"
