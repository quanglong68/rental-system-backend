server:
  port: 8085

spring:
  application:
    name: contract-tenant-service
  datasource:
    url: ${CONTRACT_DB_URL:jdbc:postgresql://localhost:5432/contract_db}
    username: ${CONTRACT_DB_USER:contract_svc}
    password: ${CONTRACT_DB_PASSWORD:changeit}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  # Producer for the outbox relay (docs muc 5.3); same settings as auth-service.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: contract-tenant-service
      auto-offset-reset: earliest
      # Spec 5.3: ack-mode RECORD is configured on the listener factory (KafkaConfig).
      properties:
        enable.auto.commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p [correlationId:%X{correlationId}] [userId:%X{userId}]"
