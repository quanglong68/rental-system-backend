# Task D1: dinh tuyen theo prefix (docs Table 2) + Task D3: CORS, JWT (docs muc 4.2, 6.1).
# Khong StripPrefix: service ha nguon giu nguyen /api/v1/... (controller da khai bao day du).
server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    # Dev local: service vua restart phai duoc nhan dien lai trong ~5s thay vi 35-60s
    # (mac dinh cache cua LoadBalancer la 35s).
    loadbalancer:
      cache:
        ttl: 5s
    gateway:
      # Route tuong minh, khong dung discovery locator (ke hoach D1).
      discovery:
        locator:
          enabled: false
      routes:
        # Moi service giu /v3/api-docs noi bo; gateway cung cap URL rieng cho Swagger UI.
        - id: auth-openapi-docs
          uri: lb://auth-service
          predicates:
            - Path=/v3/api-docs/auth-service
          filters:
            - SetPath=/v3/api-docs
            - OpenApiGatewayServer
        - id: user-notification-openapi-docs
          uri: lb://user-notification-service
          predicates:
            - Path=/v3/api-docs/user-notification-service
          filters:
            - SetPath=/v3/api-docs
            - OpenApiGatewayServer
        - id: property-openapi-docs
          uri: lb://property-service
          predicates:
            - Path=/v3/api-docs/property-service
          filters:
            - SetPath=/v3/api-docs
            - OpenApiGatewayServer
        - id: listing-booking-openapi-docs
          uri: lb://listing-booking-service
          predicates:
            - Path=/v3/api-docs/listing-booking-service
          filters:
            - SetPath=/v3/api-docs
            - OpenApiGatewayServer
        - id: chat-openapi-docs
          uri: lb://chat-service
          predicates:
            - Path=/v3/api-docs/chat-service
          filters:
            - SetPath=/v3/api-docs
            - OpenApiGatewayServer
        - id: contract-tenant-openapi-docs
          uri: lb://contract-tenant-service
          predicates:
            - Path=/v3/api-docs/contract-tenant-service
          filters:
            - SetPath=/v3/api-docs
            - OpenApiGatewayServer
        - id: billing-utility-openapi-docs
          uri: lb://billing-utility-service
          predicates:
            - Path=/v3/api-docs/billing-utility-service
          filters:
            - SetPath=/v3/api-docs
            - OpenApiGatewayServer
        - id: asset-maintenance-openapi-docs
          uri: lb://asset-maintenance-service
          predicates:
            - Path=/v3/api-docs/asset-maintenance-service
          filters:
            - SetPath=/v3/api-docs
            - OpenApiGatewayServer
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
        - id: user-notification-service
          uri: lb://user-notification-service
          predicates:
            - Path=/api/v1/users/**,/api/v1/staff/**,/api/v1/notifications/**,/api/v1/devices/**
        - id: property-service
          uri: lb://property-service
          predicates:
            - Path=/api/v1/locations/**,/api/v1/provinces/**,/api/v1/wards/**,/api/v1/buildings/**,/api/v1/room-types/**,/api/v1/rooms/**,/api/v1/images/**
        - id: listing-booking-service
          uri: lb://listing-booking-service
          predicates:
            - Path=/api/v1/listings/**,/api/v1/rental-requests/**,/api/v1/appointments/**,/api/v1/roommate-posts/**,/api/v1/roommate-applications/**
        - id: chat-service
          uri: lb://chat-service
          predicates:
            - Path=/api/v1/chat/**
        - id: contract-tenant-service
          uri: lb://contract-tenant-service
          predicates:
            - Path=/api/v1/contracts/**,/api/v1/move-out-requests/**,/api/v1/renewal-requests/**
        - id: billing-utility-service
          uri: lb://billing-utility-service
          predicates:
            - Path=/api/v1/utility-types/**,/api/v1/meters/**,/api/v1/meter-readings/**,/api/v1/services/**,/api/v1/contract-services/**,/api/v1/invoices/**,/api/v1/room-invoices/**,/api/v1/payments/**
        - id: asset-maintenance-service
          uri: lb://asset-maintenance-service
          predicates:
            - Path=/api/v1/appliances/**,/api/v1/reports/**,/api/v1/maintenance-requests/**,/api/v1/maintenance-schedules/**
        - id: minio-images
          uri: http://minio:9000
          predicates:
            - Path=/property-images/**,/report-images/**
          filters:
            - PreserveHostHeader
      # CORS cho web/app (docs muc 4.2, Task D3): origin qua env, FE dev tren 3000/8443 hoac Vercel.
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,https://localhost:*,https://*.vercel.app}
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

springdoc:
  swagger-ui:
    disable-swagger-default-url: true
    config-url: /swagger-config

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    # Dev local: lay lai registry moi 5s de thay instance vua restart.
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true

# JWT (docs muc 7.1, 6.1): cung secret/iss/claims voi auth-service (veriy HS256).
jwt:
  secret: ${JWT_SECRET:please-override-min-32-chars-secret-for-local-dev}
  issuer: ${JWT_ISSUER:rental-auth}

management:
  endpoints:
    web:
      exposure:
        include: health,info
