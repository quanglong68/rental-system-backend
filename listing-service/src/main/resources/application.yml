spring:
  application:
    name: listing-service

  profiles:
    default: local

  datasource:
    url: ${LISTING_DB_URL:jdbc:postgresql://localhost:5432/listing_db}
    username: ${LISTING_DB_USER:listing_svc}
    password: ${LISTING_DB_PASSWORD:listing_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: listing-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

server:
  port: 8084
  shutdown: graceful

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

snowflake:
  generator-id: ${SNOWFLAKE_GENERATOR_ID:0}

property:
  internal-key: ${PROPERTY_INTERNAL_SECRET:}
  kafka:
    property-topic: ${PROPERTY_EVENTS_TOPIC:property.events}

staff:
  assignment:
    internal-key: ${STAFF_ASSIGNMENT_SECRET:}

logging:
  level:
    root: INFO
    com.rental.listingservice: DEBUG
