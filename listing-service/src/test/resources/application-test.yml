spring:
  datasource:
    url: ${LISTING_TEST_DB_URL:jdbc:postgresql://127.0.0.1:55432/listing_test_db}
    username: ${LISTING_TEST_DB_USER:listing_test_svc}
    password: ${LISTING_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
  cloud:
    discovery:
      enabled: false
eureka:
  client:
    enabled: false
