server:
  port: 8084

spring:
  application:
    name: listing-booking-service
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
  datasource:
    url: ${LISTING_DB_URL:jdbc:postgresql://localhost:5432/listing_db}
    username: ${LISTING_DB_USER:listing_svc}
    password: ${LISTING_DB_PASSWORD:change_me_in_dot_env}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: listing-booking-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: record

feign:
  circuitbreaker:
    enabled: true
  client:
    config:
      default:
        connectTimeout: 2000
        readTimeout: 3000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    # Dev local: heartbeat nhanh de Gateway thay instance vua restart trong ~5-10s.
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

management:
  endpoints:
    web:
      exposure:
        include: health,info

booking:
  max-move-in-days: ${BOOKING_MAX_MOVE_IN_DAYS:30}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:minioadmin}
    secret-key: ${MINIO_ROOT_PASSWORD:change_me_in_dot_env}
    bucket: ${MINIO_IDENTITY_BUCKET:identity-documents}

logging:
  pattern:
    level: "%5p [correlationId:%X{correlationId}] [userId:%X{userId}]"
