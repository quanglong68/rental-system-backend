# Task C1: cau hinh nen auth-service (docs muc 7, 12).
# Moi secret doc tu env; gia tri sau dau ":" chi dung local dev, KHONG commit .env that.
server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${AUTH_DB_USER:auth_user}
    password: ${AUTH_DB_PASSWORD:changeit}
    driver-class-name: org.postgresql.Driver
  jpa:
    # Chi Flyway tao bang (docs muc 12); khong de Hibernate tu sua schema.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Producer idempotent theo docs muc 5.3 (khoa message, outbox relay dung template nay o Task C6).
      acks: all
      properties:
        enable.idempotence: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# JWT (docs muc 7.1): HS256, toi thieu 32 ky tu, iss=rental-auth, access 15 phut (900s).
jwt:
  secret: ${JWT_SECRET:please-override-min-32-chars-secret-for-local-dev}
  issuer: ${JWT_ISSUER:rental-auth}
  access-expiration: 900

management:
  endpoints:
    web:
      exposure:
        include: health,info
