# Docs muc 12: mot file infra/docker-compose.yml cho ca he thong.
# Thu tu khoi dong: postgres, kafka, minio -> discovery-server -> service nghiep vu -> api-gateway.
# Docs muc 4 + 6.2: CHI api-gateway (8080) publish ra host, kem cong cu dev (kafka-ui 8090, minio console 9001).
# Moi secret doc tu bien moi truong (file .env copy tu .env.example), KHONG hardcode (AIRule S5).
name: rental-system

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: rental-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (copy .env.example to .env)}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES:-auth_db,user_db,property_db,listing_db,contract_db,billing_db,asset_db}
      AUTH_DB_USER: ${AUTH_DB_USER:-auth_user}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}
      USER_DB_USER: ${USER_DB_USER:-user_svc}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?USER_DB_PASSWORD is required}
      PROPERTY_DB_USER: ${PROPERTY_DB_USER:-property_svc}
      PROPERTY_DB_PASSWORD: ${PROPERTY_DB_PASSWORD:?PROPERTY_DB_PASSWORD is required}
      LISTING_DB_USER: ${LISTING_DB_USER:-listing_svc}
      LISTING_DB_PASSWORD: ${LISTING_DB_PASSWORD:?LISTING_DB_PASSWORD is required}
      CONTRACT_DB_USER: ${CONTRACT_DB_USER:-contract_svc}
      CONTRACT_DB_PASSWORD: ${CONTRACT_DB_PASSWORD:?CONTRACT_DB_PASSWORD is required}
      BILLING_DB_USER: ${BILLING_DB_USER:-billing_svc}
      BILLING_DB_PASSWORD: ${BILLING_DB_PASSWORD:?BILLING_DB_PASSWORD is required}
      ASSET_DB_USER: ${ASSET_DB_USER:-asset_svc}
      ASSET_DB_PASSWORD: ${ASSET_DB_PASSWORD:?ASSET_DB_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    networks:
      - rental-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    container_name: rental-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
    networks:
      - rental-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Tao san topic theo docs muc 5.3 (moi service so huu 1 topic; 3 partition, RF=1 cho dev).
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: rental-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - rental-net
    command:
      - bash
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists \
          --topic auth.events --partitions 3 --replication-factor 1 \
          --bootstrap-server kafka:9092
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: rental-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: rental
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - rental-net

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: rental-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - miniodata:/data
    ports:
      - "9001:9001"
    networks:
      - rental-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Docs muc 4.3: bucket report-images (anh bao hu, upload bang presigned URL).
  minio-init:
    image: minio/mc:RELEASE.2024-11-07T00-52-20Z
    container_name: rental-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - rental-net
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" && \
        mc mb --ignore-existing local/report-images
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    restart: "no"

  discovery-server:
    # Build tu repo root de thay parent pom (dockerfile tuong tu cho cac service khac).
    build:
      context: ..
      dockerfile: discovery-server/Dockerfile
    container_name: rental-discovery
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - rental-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12

  auth-service:
    build:
      context: ..
      dockerfile: auth-service/Dockerfile
    container_name: rental-auth
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: ${AUTH_DB_USER:-auth_user}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}
      EUREKA_URL: http://discovery-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (min 32 chars)}
      JWT_ISSUER: ${JWT_ISSUER:-rental-auth}
    networks:
      - rental-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12

  api-gateway:
    # Build tu repo root de thay parent pom + common-lib (giong discovery/auth).
    build:
      context: ..
      dockerfile: api-gateway/Dockerfile
    container_name: rental-gateway
    restart: unless-stopped
    depends_on:
      discovery-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_URL: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (min 32 chars)}
      JWT_ISSUER: ${JWT_ISSUER:-rental-auth}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    networks:
      - rental-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  rental-net:
    driver: bridge

volumes:
  pgdata:
  miniodata:
