server:
  port: 8088
  # SSE giu connection mo lau; khong de container/proxy cat som.
  tomcat:
    connection-timeout: 30s

spring:
  application:
    name: chat-service
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
  datasource:
    url: ${CHAT_DB_URL:jdbc:postgresql://localhost:5432/chat_db}
    username: ${CHAT_DB_USER:chat_svc}
    password: ${CHAT_DB_PASSWORD:changeit}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

feign:
  circuitbreaker:
    enabled: true
  client:
    config:
      default:
        connectTimeout: 2000
        readTimeout: 3000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    # Dev local: heartbeat nhanh de Gateway thay instance vua restart trong ~5-10s.
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

management:
  endpoints:
    web:
      exposure:
        include: health,info

chat:
  sse:
    timeout-ms: ${CHAT_SSE_TIMEOUT_MS:1800000}
    heartbeat-ms: ${CHAT_SSE_HEARTBEAT_MS:20000}
    max-connections-per-user: ${CHAT_SSE_MAX_CONNECTIONS_PER_USER:3}
  message:
    max-length: ${CHAT_MESSAGE_MAX_LENGTH:2000}

logging:
  pattern:
    level: "%5p [correlationId:%X{correlationId}] [userId:%X{userId}]"
