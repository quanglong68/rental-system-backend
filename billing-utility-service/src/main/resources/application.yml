# billing-utility-service (docs muc 9.5, 12). Port 8086, database billing_db.
# Moi secret doc tu env; gia tri sau dau ":" chi dung local dev, KHONG commit .env that.
server:
  port: 8086

spring:
  application:
    name: billing-utility-service
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
  datasource:
    url: ${BILLING_DB_URL:jdbc:postgresql://localhost:5432/billing_db}
    username: ${BILLING_DB_USER:billing_svc}
    password: ${BILLING_DB_PASSWORD:changeit}
    driver-class-name: org.postgresql.Driver
  jpa:
    # Chi Flyway tao bang (docs muc 12); khong de Hibernate tu sua schema.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Producer idempotent theo docs muc 5.3.
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      # Consumer theo docs muc 5.3: group = ten service, commit tay tung record, doc tu dau.
      group-id: billing-utility-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: record
      # Loi xu ly: bean DefaultErrorHandler trong AppConfig (thu 3 lan 1s -> DLT, docs 5.3).

feign:
  circuitbreaker:
    enabled: true
  client:
    config:
      default:
        connectTimeout: 2000
        readTimeout: 3000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# Scheduler + han thanh toan (docs muc 9.5): chot so 02:00 ngay closing-day, han = issuedAt + due-days.
billing:
  closing-day: ${BILLING_CLOSING_DAY:1}
  due-days: ${BILLING_DUE_DAYS:7}

# Mui gio he thong UTC; scheduler doi sang Asia/Ho_Chi_Minh bang zone trong @Scheduled.
management:
  endpoints:
    web:
      exposure:
        include: health,info
